version: "3.9"

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  redis_data:
  model_data:

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    volumes:
      - ./credentials:/app/credentials:ro
      - model_data:/app/models
      - ./temp:/app/temp
    ports:
      - "8000:8000"
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery ML worker (Phase 2+) ───────────────────────────────────────────
  ml-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    command: celery -A src.worker worker --loglevel=info --concurrency=2
    volumes:
      - ./credentials:/app/credentials:ro
      - model_data:/app/models
    networks: [backend]
    depends_on:
      - redis
      - backend
    profiles: [ml]   # Enable with: docker-compose --profile ml up

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks: [backend]
    depends_on:
      - backend
    profiles: [production]  # Enable with: docker-compose --profile production up
